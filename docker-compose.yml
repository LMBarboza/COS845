services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    image: attention-ssm-gb10:latest
    # Unified memory is shared with the host, so the container needs generous shared
    # memory and locked-memory limits rather than the small Docker defaults.
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./results:/app/results
      # Persist the Hugging Face cache so Stage 2 does not re-download weights.
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  hf-cache:
