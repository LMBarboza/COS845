[project]
name = "attention-vs-ssm-benchmark"
version = "0.1.0"
description = "Two-stage benchmark comparing attention mechanisms and state-space models on NVIDIA GB10 (SM121)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "rich>=13.7",
    "tqdm>=4.66",
    "einops>=0.8",
    "aiohttp>=3.10",
    "transformers>=4.51",
]

[project.optional-dependencies]
# Triton-only kernels (Mamba-2 SSD, Kimi Delta Attention). No CUDA C++ build needed,
# which matters on aarch64/SM121 where prebuilt extension wheels do not exist.
linear = ["flash-linear-attention>=0.4.0"]
# CUDA C++ extension packages. These have no aarch64 + CUDA 13 wheels and must be
# built from source; install deliberately, not via `uv sync --all-extras`.
cuda-ext = ["causal-conv1d>=1.4.0", "mamba-ssm>=2.2.4"]
serving = ["vllm>=0.10.0"]

[dependency-groups]
dev = ["ruff>=0.6.0"]

[tool.uv]
# GB10 is aarch64 with CUDA 13.0 drivers; use the cu130 wheel index.
no-build-isolation-package = ["causal-conv1d", "mamba-ssm", "flash-attn"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
